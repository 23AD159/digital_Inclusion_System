{% extends 'base.html' %}

{% block content %}
<div class="min-h-[calc(100vh-80px)] flex items-center justify-center bg-slate-50 py-12 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
    <!-- Background Accents -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none">
        <div class="absolute -top-[10%] -right-[10%] w-[40%] h-[40%] bg-indigo-500/5 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-[10%] -left-[10%] w-[40%] h-[40%] bg-violet-500/5 rounded-full blur-3xl"></div>
    </div>

    <div class="max-w-md w-full space-y-8 relative z-10">
        <div class="text-center">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-[2rem] bg-indigo-600 shadow-xl shadow-indigo-200 mb-8 transform -rotate-6">
                <i class="fa-solid fa-shield-halved text-white text-3xl"></i>
            </div>
            <h2 class="text-4xl font-extrabold text-slate-900 tracking-tight">Identity Vault</h2>
            <p class="mt-3 text-slate-500 font-medium tracking-wide">Enter your credentials to access the ecosystem</p>
        </div>

        <div class="premium-card rounded-[2.5rem] p-10 mt-10">
            <form class="space-y-6" action="{{ url_for('auth.login') }}" method="POST">
                <div>
                    <label for="email" class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 pl-1">Email Protocol</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-regular fa-envelope"></i>
                        </div>
                        <input id="email" name="email" type="email" autocomplete="email" required 
                            class="block w-full pl-11 pr-4 py-4 rounded-2xl border-slate-200 bg-slate-50/50 text-slate-900 font-bold focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all outline-none" 
                            placeholder="user@network.com">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 pl-1">Master Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </div>
                        <input id="password" name="password" type="password" autocomplete="current-password" required 
                            class="block w-full pl-11 pr-4 py-4 rounded-2xl border-slate-200 bg-slate-50/50 text-slate-900 font-bold focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all outline-none" 
                            placeholder="••••••••">
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" 
                        class="group relative w-full flex justify-center py-4 px-4 border border-transparent text-lg font-bold rounded-2xl text-white bg-slate-900 hover:bg-indigo-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all shadow-xl shadow-slate-200 hover:shadow-indigo-200 hover:-translate-y-1">
                        Decrypt & Access
                    </button>
                </div>
            </form>

            <div class="mt-10 pt-8 border-t border-slate-100">
                <div class="flex flex-col items-center gap-4">
                    <p class="text-sm font-bold text-slate-400">No identity detected in system?</p>
                    <a href="{{ url_for('auth.register') }}" 
                        class="inline-flex items-center gap-2 px-6 py-2 rounded-xl bg-indigo-50 text-indigo-600 font-bold hover:bg-indigo-100 transition-colors">
                        Initialize New Account <i class="fa-solid fa-plus text-xs"></i>
                    </a>
                </div>
            </div>
        </div>
        
        <!-- Admin Hint -->
        <div class="p-4 rounded-2xl bg-amber-50 border border-amber-100 flex items-center gap-4">
            <div class="w-10 h-10 rounded-xl bg-amber-100 flex items-center justify-center text-amber-600">
                <i class="fa-solid fa-user-gear"></i>
            </div>
            <div class="text-[11px] font-bold text-amber-700 uppercase tracking-tighter">
                <span class="opacity-60">Admin Bypass:</span> admin@admin.com / admin123
            </div>
        </div>
    </div>
</div>
  </div>
</div>
{% endblock %}
