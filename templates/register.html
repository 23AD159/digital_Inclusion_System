{% extends 'base.html' %}

{% block content %}
<div class="min-h-[calc(100vh-80px)] flex items-center justify-center bg-slate-50 py-16 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
    <!-- Background Accents -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none">
        <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-indigo-500/5 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-[20%] -right-[10%] w-[50%] h-[50%] bg-violet-500/5 rounded-full blur-3xl"></div>
    </div>

    <div class="max-w-2xl w-full space-y-8 relative z-10">
        <div class="text-center">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-[2rem] bg-indigo-600 shadow-xl shadow-indigo-200 mb-8">
                <i class="fa-solid fa-user-plus text-white text-3xl"></i>
            </div>
            <h2 class="text-4xl font-extrabold text-slate-900 tracking-tight">Create Your Identity</h2>
            <p class="mt-3 text-slate-500 font-medium tracking-wide">Join the AI-driven digital inclusion ecosystem</p>
        </div>

        <div class="premium-card rounded-[3rem] p-10 sm:p-14 mt-10">
            <form class="grid grid-cols-1 md:grid-cols-2 gap-8" action="{{ url_for('auth.register') }}" method="POST">
                <!-- Name -->
                <div class="md:col-span-2">
                    <label for="name" class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 pl-1">Full Name</label>
                    <input id="name" name="name" type="text" required 
                        class="block w-full px-6 py-4 rounded-2xl border-slate-200 bg-slate-50/50 text-slate-900 font-bold focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all outline-none" 
                        placeholder="Jane Doe">
                </div>

                <!-- College -->
                <div class="md:col-span-1">
                    <label for="college_name" class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 pl-1">University / College</label>
                    <input id="college_name" name="college_name" type="text" required 
                        class="block w-full px-6 py-4 rounded-2xl border-slate-200 bg-slate-50/50 text-slate-900 font-bold focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all outline-none" 
                        placeholder="Institute Name">
                </div>

                <!-- Department -->
                <div class="md:col-span-1">
                    <label for="department" class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 pl-1">Department</label>
                    <input id="department" name="department" type="text" required 
                        class="block w-full px-6 py-4 rounded-2xl border-slate-200 bg-slate-50/50 text-slate-900 font-bold focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all outline-none" 
                        placeholder="e.g. Computer Science">
                </div>

                <!-- Year -->
                <div class="md:col-span-1">
                    <label for="year_of_study" class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 pl-1">Academic Year</label>
                    <select id="year_of_study" name="year_of_study" required 
                        class="block w-full px-6 py-4 rounded-2xl border-slate-200 bg-slate-50/50 text-slate-900 font-bold focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all outline-none appearance-none">
                        <option value="1st Year">1st Year</option>
                        <option value="2nd Year">2nd Year</option>
                        <option value="3rd Year">3rd Year</option>
                        <option value="4th Year">4th Year</option>
                        <option value="Graduate">Postgraduate</option>
                    </select>
                </div>

                <!-- Email -->
                <div class="md:col-span-1">
                    <label for="email" class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 pl-1">Email Protocol</label>
                    <input id="email" name="email" type="email" required 
                        class="block w-full px-6 py-4 rounded-2xl border-slate-200 bg-slate-50/50 text-slate-900 font-bold focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all outline-none" 
                        placeholder="student@network.com">
                </div>

                <!-- Password -->
                <div class="md:col-span-2">
                    <label for="password" class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 pl-1">Secure Password</label>
                    <input id="password" name="password" type="password" required 
                        class="block w-full px-6 py-4 rounded-2xl border-slate-200 bg-slate-50/50 text-slate-900 font-bold focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all outline-none" 
                        placeholder="••••••••">
                </div>

                <div class="md:col-span-2 pt-4">
                    <button type="submit" 
                        class="w-full flex justify-center py-5 px-4 border border-transparent text-lg font-extrabold rounded-[1.5rem] text-white bg-slate-900 hover:bg-indigo-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all shadow-xl shadow-slate-200 hover:shadow-indigo-200 hover:-translate-y-1">
                        Register & Get Started
                    </button>
                </div>
            </form>

            <div class="mt-12 pt-8 border-t border-slate-100 flex flex-col items-center gap-4">
                <p class="text-sm font-bold text-slate-400">Already part of the database?</p>
                <a href="{{ url_for('auth.login') }}" 
                    class="inline-flex items-center gap-2 px-8 py-3 rounded-2xl bg-indigo-50 text-indigo-600 font-bold hover:bg-indigo-100 transition-all">
                    Launch Login Node <i class="fa-solid fa-arrow-right text-xs"></i>
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
